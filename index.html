<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dado 3D com Som</title>

  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: url('img/Fundo.jpg');
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .logo-container {
      position: absolute;
      top: 10px;
    }

    .logo {
      max-width: 1000px;
    }

    .scene {
      width: 300px;
      height: 300px;
      perspective: 1000px;
    }

    .dice {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 3s cubic-bezier(0.5, 0.5, 0.1, 1.0);
    }

    .face {
      position: absolute;
      width: 300px;
      height: 300px;
      background: #ecf0f1;
      border: 2px solid #34495e;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
      box-sizing: border-box;
    }

    .face1 { transform: rotateY(0deg) translateZ(150px); }
    .face2 { transform: rotateY(90deg) translateZ(150px); }
    .face3 { transform: rotateY(180deg) translateZ(150px); }
    .face4 { transform: rotateY(-90deg) translateZ(150px); }
    .face5 { transform: rotateX(90deg) translateZ(150px); }
    .face6 { transform: rotateX(-90deg) translateZ(150px); }

    .info {
      margin-top: 20px;
      font-size: 1.5rem;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="logo-container">
    <img src="img/logo.png" class="logo">
  </div>

  <div class="scene">
    <div id="dice" class="dice">
      <div class="face face1"><img src="img/face.png"></div>
      <div class="face face2"><img src="img/face1.png"></div>
      <div class="face face3"><img src="img/face2.png"></div>
      <div class="face face4"><img src="img/face3.png"></div>
      <div class="face face5"><img src="img/face4.png"></div>
      <div class="face face6"><img src="img/face5.png"></div>
    </div>
  </div>

  <audio id="diceSound" src="img/dice.mp3"></audio>

  <script>
    const dice = document.getElementById('dice');
    const sound = document.getElementById('diceSound');
    let rolling = false;

    function rollDice() {
      if (rolling) return;
      rolling = true;

      sound.currentTime = 0;
      sound.play();

      const randomRoll = Math.floor(Math.random() * 6) + 1;

      let rotationX = 0;
      let rotationY = 0;

      switch (randomRoll) {
        case 1: rotationX = 0; rotationY = 0; break;
        case 2: rotationX = 0; rotationY = -90; break;
        case 3: rotationX = 0; rotationY = 180; break;
        case 4: rotationX = 0; rotationY = 90; break;
        case 5: rotationX = 90; rotationY = 0; break;
        case 6: rotationX = -90; rotationY = 0; break;
      }

      const extraRotX = Math.floor(Math.random() * 4) * 360;
      const extraRotY = Math.floor(Math.random() * 4) * 360;

      dice.style.transform = `
        rotateX(${rotationX + extraRotX}deg)
        rotateY(${rotationY + extraRotY}deg)
      `;

      setTimeout(() => {
        rolling = false;
      }, 3000);
    }

    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space') {
        e.preventDefault();
        rollDice();
      }
    });
  </script>

</body>
</html>
